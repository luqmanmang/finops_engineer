name: Bootstrap Canonical FinOps Mirror

on:
  push:
    paths:
      - '.github/workflows/bootstrap-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Clone canonical source main
        run: git clone --depth 1 --branch main https://github.com/rajeluqman/finops-engineer.git /tmp/finops-source

      - name: Mirror canonical working tree except workflow files
        run: rsync -a --delete --exclude='.git/' --exclude='.github/workflows/***' /tmp/finops-source/ ./

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate market census contracts
        run: python python/market_census/build_market_census.py --validate-only

      - name: Commit mirrored content to target main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Non-workflow content already matches canonical source."
          else
            git commit -m "Mirror canonical FinOps repository content"
            git push origin HEAD:main
          fi

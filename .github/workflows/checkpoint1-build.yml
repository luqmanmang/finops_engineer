name: Checkpoint 1 Census Build

on:
  push:
    branches:
      - checkpoint-1/market-census-2026-09-30
    paths:
      - '.github/workflows/checkpoint1-build.yml'

permissions:
  contents: write

jobs:
  patch-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: checkpoint-1/market-census-2026-09-30
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calibrate stakeholder and certification signals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          taxonomy_path = Path('market/schemas/signal_taxonomy.json')
          taxonomy = json.loads(taxonomy_path.read_text(encoding='utf-8'))
          taxonomy['certification'] = {
              'finops_practitioner': ['finops certified practitioner', 'focp'],
              'finops_professional': ['finops certified professional'],
              'finops_engineer_certification': ['finops certified engineer'],
              'aws_certification': ['aws certified', 'aws cloud financial management certification'],
              'azure_certification': ['azure fundamentals', 'az-900', 'azure cost management specialty'],
              'gcp_certification': ['google cloud digital leader', 'gcp certification', 'google cloud certification'],
              'security_certification': ['ccsp', 'certified cloud security professional'],
              'power_bi_certification': ['power bi data analyst associate', 'pl-300'],
          }
          business_terms = taxonomy['stakeholder']['business_units']
          for term in ['business manager', 'business managers', 'product owner', 'product owners']:
              if term not in business_terms:
                  business_terms.append(term)
          taxonomy_path.write_text(json.dumps(taxonomy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          raw_updates = {
              'MY-FE-0001': ' Work with Finance team and Procurement team on budgets and purchase planning.',
              'MY-FE-0002': ' Partner with Cloud Engineering team, Finance team, Security and Application teams, Product Owners and Business Managers.',
              'MY-FE-0003': ' Partner with Engineering team, Product team and Finance team on architecture, scaling and cost decisions.',
              'MY-FE-0004': ' Partner with Finance team (FP&A), Engineering team and Product team on forecasting and investment decisions.',
          }
          for vacancy_id, sentence in raw_updates.items():
              path = Path('market/raw') / f'{vacancy_id}.json'
              payload = json.loads(path.read_text(encoding='utf-8'))
              if sentence.strip() not in payload['responsibility_text']:
                  payload['responsibility_text'] += sentence
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          builder = Path('python/market_census/build_market_census.py')
          text = builder.read_text(encoding='utf-8')
          if '"certification_frequency.csv"' not in text:
              anchor = '    "bi_tool_frequency.csv": ("bi_tool", ["power_bi", "tableau", "excel"]),\n'
              assert anchor in text, 'DERIVED_OUTPUTS anchor not found'
              text = text.replace(anchor, anchor + '    "certification_frequency.csv": ("certification", None),\n')

              anchor = '    stakeholders = frequency_rows(records, groups["stakeholder"], "stakeholder")\n'
              assert anchor in text, 'market analysis stakeholder anchor not found'
              text = text.replace(anchor, anchor + '    certifications = frequency_rows(records, groups["certification"], "certification")\n')

              old = '## Certification demand\\n\\n_Not automatically inferred by this pipeline yet. Certification claims require explicit source-backed extraction during market review._'
              new = '## Certification demand\\n\\n{markdown_table(certifications, \'certification\')}'
              assert old in text, 'certification report placeholder not found'
              text = text.replace(old, new)

              anchor = '            elif filename == "skill_frequency.csv":\n                names = groups["engineering"]\n'
              assert anchor in text, 'derived-output dispatch anchor not found'
              text = text.replace(anchor, anchor + '            elif filename == "certification_frequency.csv":\n                names = groups["certification"]\n')
          builder.write_text(text, encoding='utf-8')

          tests = Path('tests/test_market_census.py')
          test_text = tests.read_text(encoding='utf-8')
          if 'test_certification_taxonomy_is_source_backed' not in test_text:
              marker = '    def test_eligibility_requires_evidence(self):\n'
              addition = '''    def test_certification_taxonomy_is_source_backed(self):\n        taxonomy = market_census.load_json(market_census.TAXONOMY_PATH)\n        fields, keywords, groups = market_census.flatten_taxonomy(taxonomy)\n        record = {\n            "role_summary": "",\n            "responsibility_text": "",\n            "requirement_text": "",\n            "preferred_text": "FinOps Certified Practitioner and Azure Fundamentals AZ-900.",\n            "manual_overrides": {},\n        }\n        signals = market_census.classify(record, fields, keywords)\n        self.assertTrue(signals["finops_practitioner"])\n        self.assertTrue(signals["azure_certification"])\n        self.assertIn("certification", groups)\n        self.assertIn("certification_frequency.csv", market_census.DERIVED_OUTPUTS)\n\n'''
              assert marker in test_text, 'test insertion marker not found'
              test_text = test_text.replace(marker, addition + marker)
              tests.write_text(test_text, encoding='utf-8')

          market_readme = Path('market/README.md')
          readme_text = market_readme.read_text(encoding='utf-8')
          if '`certification_frequency.csv`' not in readme_text:
              readme_text = readme_text.replace('- `bi_tool_frequency.csv`\n', '- `bi_tool_frequency.csv`\n- `certification_frequency.csv`\n')
              market_readme.write_text(readme_text, encoding='utf-8')

          change_control = Path('docs/CHANGE_CONTROL.md')
          cc = change_control.read_text(encoding='utf-8')
          note = '\n### 2026-09-30 — Census classifier calibration\n\n- **What changed:** Added explicit certification-demand taxonomy/output and calibrated source-backed stakeholder wording for Finance, Engineering, Product/Business and Procurement.\n- **Why:** The first deterministic build undercounted stakeholder collaboration and left certification demand as a placeholder even though active vacancies explicitly disclose both.\n- **Impact:** `certification_frequency.csv` becomes a generated market artifact; stakeholder and certification tables now derive from the same audited raw records as other frequencies.\n'
          if 'Census classifier calibration' not in cc:
              change_control.write_text(cc.rstrip() + note + '\n', encoding='utf-8')
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build market outputs
        run: make market-build

      - name: Validate generated census
        run: make market-check

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/market_census/build_market_census.py tests/test_market_census.py market docs/MARKET_ANALYSIS.md docs/CHANGE_CONTROL.md
          git commit -m "Complete Checkpoint 1 market signal outputs"
          git push origin HEAD:checkpoint-1/market-census-2026-09-30
